<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Super Science</title>
  <meta name="description" content="Interactive maths concepts from @super.science9. Taylor series, vectors, projectile motion and more.">
  <meta name="theme-color" content="#000000">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">

<body>
  <!-- Sidebar: permanent on wide screens, a slide-out drawer on phones (nav.js) -->
  <nav class="sidebar" id="sidebar" aria-label="Main menu"></nav>
  <div class="backdrop" id="backdrop" hidden></div>

  <header class="site-header">
    <h1 class="logo"><a href="#" aria-label="Super Science home">SUPER <span>SCIENCE</span></a></h1>
    <div class="header-row">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">☰</button>
      <a class="power" id="power" href="#profile" aria-label="Power level. Open profile."></a>
      <button type="button" class="sound-toggle" id="sound-toggle" data-sound-toggle aria-label="Sound">🔊</button>
    </div>
  </header>

  <main class="concepts" id="app">
    <noscript><p class="intro">Super Science needs JavaScript turned on.</p></noscript>
  </main>

  <footer class="site-footer">
    <a href="https://instagram.com/super.science9" target="_blank" rel="noopener">Follow <strong>@super.science9</strong></a>
  </footer>

  <script src="sound/sfx.js"></script>
  <script src="core.js"></script>
  <!-- XP / Power Level: numbers, rules, saving, then the on-screen parts. -->

  <script src="xp/engine.js"></script>
  <script src="xp/storage.js"></script>
  <script src="xp/ui.js"></script>
  <script src="quiz.js"></script>
  <!-- Concepts: one file each. Cards appear on the home screen in this order. -->
  <script src="concepts/taylor.js"></script>
  <script src="concepts/vectors.js"></script>
  <script src="concepts/projectile.js"></script>
  <script src="concepts/euler-e.js"></script>
  <script src="concepts/euler-identity.js"></script>
  <script src="concepts/integration.js"></script>
  <script src="concepts/centripetal.js"></script>
  <script src="concepts/terminal-velocity.js"></script>
  <script src="concepts/pendulum.js"></script>
  <script src="concepts/ph.js"></script>
  <script src="concepts/gas.js"></script>
  <script src="concepts/atom.js"></script>
  <script src="concepts/natural-selection.js"></script>
  <script src="concepts/punnett.js"></script>
  <script src="concepts/enzymes.js"></script>
  <!-- Questions: one file per concept ("Test yourself" quiz). -->
  <script src="questions/taylor.js"></script>
  <script src="questions/vectors.js"></script>
  <script src="questions/projectile.js"></script>
  <script src="questions/euler-e.js"></script>
  <script src="questions/euler-identity.js"></script>
  <script src="questions/integration.js"></script>
  <script src="questions/centripetal.js"></script>
  <script src="questions/terminal-velocity.js"></script>
  <script src="questions/pendulum.js"></script>
  <script src="questions/ph.js"></script>
  <script src="questions/gas.js"></script>
  <script src="questions/atom.js"></script>
  <script src="questions/natural-selection.js"></script>
  <script src="questions/punnett.js"></script>
  <script src="questions/enzymes.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>

</html>
